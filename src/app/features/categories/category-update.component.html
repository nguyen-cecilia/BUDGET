<form class="space-y-4" [formGroup]="categoryForm" (ngSubmit)="submitCategory()">
    <div class="space-y-1">
        <div class="flex items-end gap-3">
            <app-color-picker [color]="selectedColor()" (colorChange)="selectColor($event)"/>

            <label for="label" class="flex-1">
                <input id="label" type="text" placeholder="Nouvelle catégorie" formControlName="label">
            </label>

            @if (!editingCategory()) {
                <button app-button (click)="submitCategory()" [disabled]="isSubmitting()">
                    @if (isSubmitting()) {
                        <svg lucideLoaderCircle [size]="16" class="animate-spin"></svg>
                        Envoi...
                    } @else {
                        <svg lucidePlus [size]="16"></svg>
                        <span class="hidden lg:inline">Ajouter</span>
                    }
                </button>
            }
        </div>

        <app-field-error
            [control]="categoryForm.controls['label']"
            [messages]="{required: 'Le label est requis.'}"
        />
    </div>

    <div class="flex items-center gap-2">
        <p class="text-sm font-medium text-muted">Type :</p>
        @for (type of typeOptions; track type.value) {
            <button
                type="button"
                app-badge
                [variant]="categoryForm.get('type')?.value === type.value ? 'secondary' : 'outline'"
                (click)="categoryForm.get('type')?.setValue(type.value)"
            >
                {{ type.label }}
            </button>
        }
    </div>

    <app-form-error [message]="errorMessage()"/>

    @if (editingCategory()) {
        <div class="mt-6 flex items-center justify-between gap-3">
            <button app-button variant="invalid" (click)="confirmDelete.set(true)" [disabled]="confirmDelete()">
                <svg lucideTrash2 [size]="16"></svg>
                Supprimer
            </button>

            <button app-button (click)="submitCategory()" [disabled]="isSubmitting() || confirmDelete()">
                @if (isSubmitting()) {
                    <svg lucideLoaderCircle [size]="16" class="animate-spin"></svg>
                    Envoi...
                } @else {
                    <svg lucideSave [size]="16"></svg>
                    Sauvegarder
                }
            </button>
        </div>

        @if (confirmDelete()) {
            <div class="mt-6 space-y-3 rounded border border-red/40 bg-red/6 p-5">
                <p class="font-semibold text-red">
                    Supprimer « {{ editingCategory()?.label }} » ?
                </p>
                <p class="text-sm text-muted">
                    Les transactions et abonnements liés seront réaffectés ou passeront
                    « Sans catégorie ».
                </p>

                <div class="space-y-2">
                    <p>Réaffecter à :</p>
                    <app-select
                        [options]="reassignOptions()"
                        [value]="reassignTo()"
                        (valueChange)="reassignTo.set($event)"
                    ></app-select>
                </div>

                <div class="flex items-center justify-between gap-3">
                    <button app-button variant="outline" type="button" (click)="confirmDelete.set(false)">
                        Annuler
                    </button>
                    <button
                        app-button
                        variant="invalid"
                        type="button"
                        (click)="deleteCategory()"
                        [disabled]="isDeleting()"
                    >
                        @if (isDeleting()) {
                            <svg lucideLoaderCircle [size]="16" class="animate-spin"></svg>
                            Suppression...
                        } @else {
                            <svg lucideTrash2 [size]="16"></svg>
                            Confirmer
                        }
                    </button>
                </div>
            </div>
        }
    }
</form>

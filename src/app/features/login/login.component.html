<div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm bg-beige-lighter border border-gray-light rounded shadow-2xl shadow-black-dark/10 p-8">
        <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-6">
            <label>
                <p>Email</p>
                <input
                    type="email"
                    formControlName="email"
                    placeholder="votre@email.com"
                    [disabled]="isLoading()"
                />
                <app-field-error
                    [control]="loginForm.controls['email']"
                    [messages]="{required: 'L\'email est requis.', email: 'L\'email est invalide.'}"
                />
            </label>

            <label>
                <p>Mot de passe</p>
                <input
                    type="password"
                    formControlName="password"
                    placeholder="Votre mot de passe"
                    [disabled]="isLoading()"
                />
                <app-field-error
                    [control]="loginForm.controls['password']"
                    [messages]="{required: 'Le mot de passe est requis.', minlength: '6 caractères minimum.'}"
                />
            </label>

            <button
                app-button
                type="submit"
                [disabled]="isLoading()"
                class="w-full"
            >
                {{ isLoading() ? 'Connexion en cours...' : 'Se connecter' }}
            </button>

            <app-form-error [message]="errorMessage()"/>
        </form>
    </div>
</div>

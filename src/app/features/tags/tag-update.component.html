<form class="space-y-4" [formGroup]="tagForm" (ngSubmit)="submitTag()">
    <div class="space-y-1">
        <div class="flex items-end gap-3">
            <label for="label" class="flex-1">
                @if (editingTag()) {
                    <p>Label</p>
                }
                <input id="label" type="text" placeholder="Nouveau tag" formControlName="label">
            </label>

            <button app-button (click)="submitTag()" [disabled]="isSubmitting()">
                @if (isSubmitting()) {
                    <svg lucideLoaderCircle [size]="16" class="animate-spin"></svg>
                    Envoi...
                } @else if (editingTag()) {
                    <svg lucideSave [size]="16"></svg>
                    Sauvegarder
                } @else {
                    <svg lucidePlus [size]="16"></svg>
                    <span class="hidden lg:inline">Ajouter</span>
                }
            </button>
        </div>

        <app-field-error
            [control]="tagForm.controls['label']"
            [messages]="{required: 'Le label est requis.'}"
        />
    </div>

    <app-form-error [message]="errorMessage()"/>

    @if (editingTag()) {
        <button app-button variant="invalid" (click)="confirmDelete.set(true)" [disabled]="confirmDelete()">
            <svg lucideTrash2 [size]="16"></svg>
            Supprimer
        </button>
    }

    @if (confirmDelete()) {
        <div class="mt-6 space-y-3 rounded border border-red/40 bg-red/6 p-5">
            <p class="font-semibold text-red">
                Êtes-vous sûr de supprimer ce tag ?
            </p>
            <div class="flex items-center justify-between gap-3">
                <button app-button variant="outline" type="button" (click)="confirmDelete.set(false)">
                    Annuler
                </button>
                <button
                    app-button
                    variant="invalid"
                    type="button"
                    (click)="deleteTag()"
                    [disabled]="isDeleting()"
                >
                    @if (isDeleting()) {
                        <svg lucideLoaderCircle [size]="16" class="animate-spin"></svg>
                        Suppression...
                    } @else {
                        <svg lucideTrash2 [size]="16"></svg>
                        Confirmer
                    }
                </button>
            </div>
        </div>
    }
</form>

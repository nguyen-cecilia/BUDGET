<form class="space-y-4" [formGroup]="accountForm" (ngSubmit)="submitAccount()">
    @if (!modalService.account.editing()) {
        <p class="text-muted text-sm">Une fois créé, le compte ne pourra plus être supprimé.</p>
    }

    <label for="label">
        <p>Label</p>
        <input id="label" type="text" placeholder="Ex : Caisse d'Epargne" formControlName="label">
        <app-field-error
            [control]="accountForm.controls['label']"
            [messages]="{required: 'Le label est requis.'}"
        />
    </label>

    <label for="currency">
        <p>Devise</p>
        <app-select
            id="currency"
            [options]="currencyOptions()"
            [value]="selectedCurrency()"
            (valueChange)="selectedCurrency.set($event)"
            [disabled]="currencies().length === 0"
        ></app-select>
        @if (currencies().length === 0) {
            <p class="text-muted text-xs mt-1">Ajoutez d'abord une devise dans les paramètres.</p>
        }
    </label>

    <label for="isDefault">
        <input id="isDefault" type="checkbox" formControlName="isDefault">
        <p>Par défaut</p>
    </label>

    <label for="isActive">
        <input id="isActive" type="checkbox" formControlName="isActive">
        <p>Actif</p>
    </label>

    <app-form-error [message]="errorMessage()"/>

    <div class="flex items-center justify-end">
        <button app-button type="submit" [disabled]="isSubmitting()" class="ml-auto">
            @if (isSubmitting()) {
                <svg lucideLoaderCircle [size]="16" class="animate-spin"></svg>
                Envoi...
            } @else {
                <svg lucideSave [size]="16"></svg>
                Sauvegarder
            }
        </button>
    </div>
</form>

<div class="flex flex-col gap-2">
    <div class="flex items-center gap-3">
        <input
            #newTagInput
            type="text"
            placeholder="Ex: travaux, vacances..."
        />
        <button app-button type="button" variant="tertiary" (click)="addNewTag(newTagInput)">
            <svg lucidePlus [size]="14"></svg>
            Ajouter
        </button>
    </div>

    <div class="relative flex flex-wrap items-center gap-2">
        @for (tag of selectedTags(); track tag.value) {
            <button app-badge type="button" variant="secondary" (click)="removeTag(tag.label)">
                #{{ tag.label }}
                <svg lucideX [size]="12"></svg>
            </button>
        }
        @for (tag of newTags(); track tag) {
            <button app-badge type="button" variant="secondary" (click)="removeTag(tag)">
                #{{ tag }}
                <svg lucideX [size]="12" class="pointer-events-none"></svg>
            </button>
        }
    </div>

    <div class="flex flex-wrap items-center gap-2">
        @for (tag of availableTagsOptions(); track tag.value) {
            <button app-badge type="button" (click)="addExistingTag(tag)">+ {{ tag.label }}</button>
        }
    </div>
</div>
